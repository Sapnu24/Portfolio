    <title>Sean Marion Velasco | Video Editor & AI Video Production Lead</title>
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('smv_portfolio_theme') || localStorage.getItem('smv_portfolio_theme_mode');
          var resolved = savedTheme === 'dark' ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.style.colorScheme = resolved;
          if (resolved === 'dark') {
            document.documentElement.classList.add('dark-theme');
            document.documentElement.classList.remove('light-theme');
          } else {
            document.documentElement.classList.add('light-theme');
            document.documentElement.classList.remove('dark-theme');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body style="margin: 0; padding: 0;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
