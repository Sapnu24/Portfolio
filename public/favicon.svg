<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Slate to Midnight -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#131D38" />
    </linearGradient>

    <!-- Border Glow Gradient: Indigo to Neon Cyan -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Text Fill Gradient: Crisp White to Pale Indigo -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Dot Gradient: Vibrant Neon Cyan -->
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Ambient Glow Filter for Accent Dot -->
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Ambient Inner Glow -->
    <radialGradient id="ambientOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.32" />
      <stop offset="55%" stop-color="#06B6D4" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer Rounded Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="124" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="20" />

  <!-- Ambient Orb Glow -->
  <circle cx="256" cy="256" r="190" fill="url(#ambientOrb)" />

  <!-- Brand Typography: SMV. Perfectly Centered in Squircle -->
  <text 
    x="256" 
    y="266" 
    font-family="system-ui, -apple-system, 'Space Grotesk', 'Plus Jakarta Sans', 'Outfit', 'Montserrat', 'Inter', sans-serif" 
    font-size="156" 
    font-weight="900" 
    letter-spacing="-1px" 
    text-anchor="middle"
    dominant-baseline="central"
  ><tspan fill="url(#textGrad)">SMV</tspan><tspan fill="url(#dotGrad)" filter="url(#cyanGlow)" dx="5">.</tspan></text>
</svg>
